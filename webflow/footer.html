<!-- NoteIQ custom code: footer.
     Paste into Webflow: Site settings > Custom code > Footer code ("Before </body> tag").
     Webflow adds GSAP and its plugins before this. This loads, in order and without
     blocking the first paint:
       1. Lenis (smooth scroll) and GSAP CustomEase
       2. the NoteIQ bundle (from the host picked in head.html)
     Lenis / CustomEase used to be <script> tags in the head code; they live here now
     (and Lenis's CSS is in bundle.css), so remove them from the head code. -->
<script>
  (function () {
    var base = window.__niqBase || (location.hostname.endsWith(".webflow.io")
      ? "https://staging-noteiq.ryan-200.workers.dev"
      : "https://noteiq.ryan-200.workers.dev");

    [
      "https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js",
      "https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js",
      base + "/bundle.js",
    ].forEach(function (src) {
      var s = document.createElement("script");
      s.src = src;
      s.async = false; // dynamic scripts with async=false run in the order they're added
      document.body.appendChild(s);
    });
  })();
</script>
