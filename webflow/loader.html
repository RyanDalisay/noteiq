<!-- NoteIQ custom code loader.
     Paste into Webflow: Site settings > Custom code > Footer code ("Before </body> tag"),
     AFTER the GSAP / Lenis / Barba script tags. -->
<script>
  (function () {
    var base = location.hostname.endsWith(".webflow.io")
      ? "https://staging-noteiq.ryan-200.workers.dev"
      : "https://noteiq.ryan-200.workers.dev";

    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = base + "/bundle.css";
    document.head.appendChild(css);

    var js = document.createElement("script");
    js.src = base + "/bundle.js";
    js.async = false;
    document.body.appendChild(js);
  })();
</script>
